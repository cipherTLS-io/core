# Draft M0 contract; parser/runner pending. See docs/design/evidence-contract.md.
id: correctness/chain
versions: ["3.5", "4.1"]
cites:
  - page: openssl-verify
    section: OPTIONS
    option: -untrusted
inputs:
  root: root.pem
  intermediate: int.pem
  leaf: leaf.pem
checks:
  - id: supplied-intermediate
    argv: [openssl, verify, -CAfile, "{root}", -untrusted, "{intermediate}", "{leaf}"]
    expect:
      outcome: valid
      exit_code: 0
  - id: omitted-intermediate
    argv: [openssl, verify, -CAfile, "{root}", "{leaf}"]
    expect:
      outcome: invalid
      reason: unable_to_get_local_issuer
# Missing inputs and execution errors cannot satisfy either assertion.
